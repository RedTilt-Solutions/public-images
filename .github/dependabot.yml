# Dependency updates. Every Dependabot PR is merged automatically and the runner image
# is republished (see .github/workflows/dependabot-automerge.yml).
version: 2

updates:
  - package-ecosystem: docker
    directory: /gh-runner
    schedule:
      interval: daily
      time: "02:00"
      timezone: Europe/London
    labels: [dependencies]
    commit-message:
      prefix: "chore(deps)"
    groups:
      docker-non-major:
        update-types: [minor, patch]
      docker-major:
        update-types: [major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
      time: "02:00"
      timezone: Europe/London
    labels: [dependencies]
    commit-message:
      prefix: "chore(deps)"
    groups:
      # One PR for all action updates. If two were open at once, merging the first would
      # leave the second behind main on the same workflow file, and GitHub refuses to let
      # the auto-merge workflow's token merge a workflow change like that.
      actions:
        patterns: ["*"]
