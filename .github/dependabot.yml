# Dependency updates. Each Dependabot PR is merged automatically once CI has built the
# runner image, and the image is then republished (see .github/workflows/dependabot-automerge.yml).
version: 2

updates:
  - package-ecosystem: docker
    directory: /gh-runner
    schedule:
      interval: daily
      time: "02:00"
      timezone: Europe/London
    labels: [dependencies]
    commit-message:
      prefix: "chore(deps)"
    groups:
      docker-non-major:
        update-types: [minor, patch]
      docker-major:
        update-types: [major]
    open-pull-requests-limit: 10

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
      time: "02:00"
      timezone: Europe/London
    labels: [dependencies]
    commit-message:
      prefix: "chore(deps)"
    groups:
      actions-non-major:
        update-types: [minor, patch]
      actions-major:
        update-types: [major]
    open-pull-requests-limit: 10
