name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Same build as release.yml, without pushing.
      - name: Build the runner image
        uses: docker/build-push-action@v7
        with:
          context: gh-runner
          file: gh-runner/Dockerfile
          push: false
